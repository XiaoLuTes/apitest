[pytest]
# unified pytest config (shared by api + ui suites)
# NOTE: keep this file ASCII-only. iniconfig reads ini with the system locale
# codec (GBK on zh-CN Windows), so any non-ASCII char here breaks pytest startup
# with UnicodeDecodeError. Put Chinese comments in README instead.
testpaths = api ui

# entry modules of the two suites
python_files = test_file.py test_from_yaml.py

# data dirs / report dirs are not collected
norecursedirs = reports .git __pycache__ .idea .pytest_cache testcase testcases variable config pages utils common core

addopts =
    -vs
    --tb=short
    --no-showlocals
;    --tb=no                ; use this when you only want the failure list (details in allure / logs / result file)
    --alluredir=reports/allure-results
    --clean-alluredir
