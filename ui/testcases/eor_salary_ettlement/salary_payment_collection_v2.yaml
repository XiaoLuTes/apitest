# ============================================================================
# EOR 薪资收款包链路（v2 · 2026-11 维护版）
#
# 业务链路：
#   结算管理（新）→ 收款结算 → EOR类收款
#   ① 建包：客户 + 客户合同 + 国家/地区 + 服务月份 + 就职国家 + 员工性质
#            → 生成结算包 code（CPP+YYYYMMDD+4位）            【tab：待创建及确认】
#   ② 建单：一名员工一条「员工结算单」（CEP+YYYYMMDD+4位），系统回填 staffId
#   ③ 提交：勾「无差异预收款」+「合并开票=是」               【tab：待上传及处理】
#   ④ 上传：下载国家模板 → 填薪资项金额 → 上传解析          【tab：待财务审核】
#   ⑤ 审核：财务审核 excel 通过 + 审核意见                  【tab：已审核】
#   ⑥ 已审核为终止态；收款结算（发起收款/核销）下期再做
#
# 链路定数（2026-11 数据库实测）：客户 528 louie测试1号客户-预收形票 / 客户合同 测试payroll /
#   客户EOR合同 测试测试法国2 / France / services_time 2026-08 这条组合已跑过 88 次，
#   顾问包员工用 louie垃圾测试(CE31PGIN)、a-louienewbee测试(CE3TWVHC)，
#   非顾问包员工用 louie测试-本地雇员(CE0YPUBT)。
#   待业务审核(tag=3)在 2026-07/08 之后没再出现过，当前链路是 2 → 4 → 5 直达。
#
# ---------------------------------------------------------------------------
# 国家模板（客户侧 / 法国 / 2026-11 版 = 95 列）列位速查
#   依据：reports/downloads/CPP202611040058~61.xlsx（本链路真实下载文件）
#   A 指标中文说明   B 结算单ID   C 薪酬周期   D 国家   E 员工名称   F 员工编号
#   G 员工工号       H 员工性质   I 客户       J 雇佣实体  K 入职时间   L 离职时间
#   M 发薪币种（系统填）
#   N..R 发薪/出勤/年假/病假/其他假期天数（输入）
#   S 标准薪资   T 餐费津贴   U 通讯津贴   V 交通津贴   W 其他津贴   X 报销
#   Y 加班费     Z 奖金       AA..AG 假期奖金/特殊津贴/年假津贴/年假折现/代通知金/离职补偿/其他结算
#   AH..AJ 缺勤扣款/无薪假扣款/其他扣款（输入）
#   AK 税前总收入(公式)  AL/AM 免税收入①②  AN 应税收入(公式)
#   AO 个税      AP 其他扣款调差   AQ..AZ 法国雇员社保 10 项
#   BA 雇员扣款合计(公式)   BB 雇员实发(公式)
#   BC..BU 法国雇主社保 19 项（输入，默认 0）
#   BV 雇主福利合计(公式)   BW 雇主总成本·发薪币(公式)
#   BZ 结算币种(系统填)     CA 开票币种(系统填)
#   CB 结算币÷发薪币 汇率（输入，系统留空，不填 CD/CN 会除零）
#   CC 开票币÷结算币 汇率（输入）
#   CD..CP GSR服务费/客户应付/开票金额（全公式，一律不填）
#   第 8 行 = 本月预收汇总(SUM 公式)，第 9、10 行 = 第 1、2 名员工（行序稳定）
#
# 本用例只填 4 类格子：标准薪资 S、餐费津贴 T、两个汇率 CB/CC（每名员工一行）。
# 其余金额列保持系统预填的 0；汇总行与合计列都是公式，框架 edit_excel 走
# WPS/Excel 引擎（edit_excel_by_wps）会重算后再保存，不用手工算汇总。
# 实测（把上一版污染的格子清零后模拟新模板）：S9=10000/T9=500 → 税前总收入 10500、
# 雇主总成本 10500；S10=15000/T10=500 → 15500；汇总开票金额 26000，无公式错误。
# ⚠ 模板换版本（56→95 已变过一次）先按上表核对列位，再改坐标。
# ---------------------------------------------------------------------------
#
# 执行前置：01 必须先跑（02/03/04 依赖它的 settlement_package_code）；05 独立成链。
# ============================================================================

